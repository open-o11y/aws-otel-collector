name: C/I ECS
on:
  push:
    branches:

    paths-ignore:
      - '.github/**'
      - '!.github/workflows/CI-ECS.yml'
      - '**.md'

env:
  TF_VAR_aws_access_key_id: ${{ secrets.INTEG_TEST_AWS_KEY_ID }}
  TF_VAR_aws_secret_access_key: ${{ secrets.INTEG_TEST_AWS_KEY_SECRET }}

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-aotutil:
    runs-on: ubuntu-latest
    steps:
      - name: Check out testing framework
        uses: actions/checkout@v2
        with:
          repository: 'aws-observability/aws-otel-test-framework'
          path: testing-framework

  e2etest-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Login to Public Integration Test ECR
        uses: docker/login-action@v1
        with:
          registry: public.ecr.aws
          username: ${{ secrets.INTEG_TEST_AWS_KEY_ID }}
          password: ${{ secrets.INTEG_TEST_AWS_KEY_SECRET }}
        env:
          AWS_REGION: us-east-1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.INTEG_TEST_AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INTEG_TEST_AWS_KEY_SECRET }}
          aws-region: us-west-2

  get-testing-suites:
    runs-on: ubuntu-latest
    outputs:
      ecs-matrix: ${{ steps.set-matrix.outputs.ecs-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v2.3.2

      - name: testing suite for ADOT operator
        id: set-matrix
        run: |
          ecs_matrix=$(python e2etest/get-testcases.py ecs_matrix)
          echo "::set-output name=ecs-matrix::$ecs_matrix"

      - name: List testing suites
        run: |
          echo ${{ steps.set-matrix.outputs.ecs-matrix }}


  e2etest-ecs:
    runs-on: ubuntu-latest
    needs: [get-testing-suites, e2etest-release ]
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.get-testing-suites.outputs.ecs-matrix) }}

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.INTEG_TEST_AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.INTEG_TEST_AWS_KEY_SECRET }}
          aws-region: us-west-2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Set up terraform
        uses: hashicorp/setup-terraform@v1

      - name: Check out testing framework
        uses: actions/checkout@v3
        with:
          repository: aws-observability/aws-otel-test-framework
          path: testing-framework

      - name: Run testing suite on ecs
        uses: nick-invision/retry@v2
        with:
          max_attempts: 3
          timeout_minutes: 60
          command: |
            opts=""
            if [[ -f testing-framework/terraform/testcases/otlp_grpc_exporter_cw_amp_xray_ecs/parameters.tfvars ]] ; then opts="-var-file=../testcases/otlp_grpc_exporter_cw_amp_xray_ecs/parameters.tfvars"; fi
            cd testing-framework/terraform/ecs
            terraform init
            if terraform apply -auto-approve -lock=false $opts -var="ecs_launch_type=EC2" -var="aoc_version=latest" -var="testcase=../testcases/otlp_grpc_exporter_cw_amp_xray_ecs" ; then
              terraform destroy -auto-approve
            else
              terraform destroy -auto-approve && exit 1
            fi

      #This is here just in case workflow cancel
      - name: Destroy resources
        uses: nick-invision/retry@v2
        with:
          max_attempts: 3
          timeout_minutes: 8
          retry_wait_seconds: 20
          command: cd testing-framework/terraform/ecs && terraform destroy -auto-approve

